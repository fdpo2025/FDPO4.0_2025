# ============================================================================
# PARÂMETROS GERAIS (usados por ambos goToXY e followLine)
# ============================================================================

loop_rate_hz: 100  # Frequência do control loop (Hz)

# Limites de velocidade
v_nom: 0.2          # Velocidade linear nominal (m/s)
v_max: 0.4          # Velocidade linear máxima (m/s) - limite absoluto
v_min: 0.03         # Velocidade linear mínima (m/s)
w_nom: 2.0          # Velocidade angular nominal (rad/s)
w_min: 0.0          # Velocidade angular mínima (rad/s)

# Limites de aceleração/desaceleração
a_max: 0.15        # Aceleração máxima (m/s²)
d_max: 0.15          # Desaceleração máxima (m/s²)

# Tolerâncias gerais
arrive_radius: 0.05 # Raio de chegada ao waypoint (m)
yaw_tol: 0.08       # Tolerância de orientação (rad)

# ============================================================================
# PARÂMETROS goToXY (navegação ponto a ponto)
# ============================================================================

kp_linear: 5.0      # Ganho proporcional para controlo linear (~1/lambda, lambda≈0.2)
kp_angular: 1.0     # Ganho proporcional para controlo angular

# ============================================================================
# PARÂMETROS followLine (seguir linha entre waypoints)
# ============================================================================
k_line: 7.5              # Ganho para correção de linha (followLine)
gain_fwd: 1.0            # GAIN_FWD - ganho forward para controlo de linha
vel_lin_nom: 0.2         # VEL_LIN_NOM - velocidade linear nominal para seguir linha (m/s)
dist_da: 0.20             # DIST_DA - distância para começar a desacelerar (m)
tol_findist: 0.05        # TOL_FINDIST - tolerância de distância final (m)
max_etf: 0.2             # MAX_ETF - máximo erro de orientação para transição GoTo_Init -> Follow_Line (rad)
tol_init_line: 0.03      # Tolerância de distância à linha para transição GoTo_Init -> Follow_Line (m)
line_switch_ratio: 0.8   # Ratio da linha para mudar para próxima (0.8 = 80%)
line_switch_ratio_drop: 0.95  # Ratio para linha antes de warehouse drop (0.95 = 95%)

k_approaching: 8.0       # Ganho para controle angular no estado Approaching
gain_approaching_fwd: 1.0 # Ganho forward para controle no estado Approaching
approaching_line_progress: 0.40  # Progresso da linha para entrar em Approaching (0.50 = 50%)
approaching_vel: 0.09   # Velocidade máx no Approaching_PickDrop v(w³); antes 0.05 (muito lento)
