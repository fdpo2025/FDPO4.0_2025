# EKF Localizer Parameters
# Configuration of covariance matrices for the Extended Kalman Filter

ekf_params:
  # Initial pose in map frame
  initial_pose:
    x: -0.695            # -695mm (left of center)
    y: -0.355            # -355mm (below center)
    theta: 1.5708        # 90° 
  
  # Initial state covariance matrix P
  initial_covariance:
    position_x: 0.05      # Initial covariance for X position (m²)
    position_y: 0.05      # Initial covariance for Y position (m²)  
    orientation: 0.05     # Initial covariance for orientation (rad²)
  
  # Process covariance matrix Q (model noise)
    position_x: 0.5   # Process covariance for X position (m²)
    position_y: 0.5   # Process covariance for Y position (m²)

