# Manga escolhida automaticamente a partir de /color_sequence:
#   manga_3 : aparecem R, G e B
#   manga_2 : aparecem B e G (e nao manga_3)
#   manga_1 : apenas B em todas as posicoes
#
# Cores no armazem: R/G/B ou R_W/G_W/B_W (wait no pick antes de voltar ao no de aproximacao).
#
# robot_spawns: pose inicial em map (metros, theta em radianos) por robot_id (0 ou 1).
# Publicado em /hardcoded_intelligent/spawn_pose quando chega /robot_identity.
# O EKF continua a ler ekf_params/initial_pose no arranque do localizer; mantém estes
# valores alinhados com conf/launch/navigation/localizer/ekf_params.yaml por robô.

missions:
  robot_spawns:
    robot_0:
      x: -0.695
      y: -0.355
      theta: 1.5708
    robot_1:
      x: -0.52
      y: -0.355
      theta: 0.0
#    robot_2:
#      x: -0.695
#      y: -0.355
#      theta: 1.5708

  manga_1:
    robot_0:
      targets:
        - [31, 16, "MSG_1", "B", 11, "MSG_1", 27, 28, 36]
        - ["W", 28, 27, 11, "G", 11, "MSG_1", 12, 19, 20]
        - [20, 19, 26, 27, 30, 22, 21, 22, "MSG_1", 30, 29, 37]
    robot_1:
      targets:
        - ["W", 31, 16, "B", "W", 11, 27, 35]
