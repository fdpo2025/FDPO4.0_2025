# custom_planner missions:
# - missions_2: run with 2 robots
# - missions_3: run with 3 robots
# - missions_4: run with 4 robots
#
# robot_spawns (por manga): usados pelo EKF no arranque (run_ekf_localizer.launch → /fdpo_missions).
# O launch usa spawn_manga (defeito manga_1) até haver color_sequence; depois o custom_planner
# publica /custom_planner/spawn_pose para a manga escolhida.
#
# Tarefas (targets):
#   Cada entrada "- [ ... ]" sob robot_N é UMA tarefa completa (estilo pick→drop).
#   O último inteiro da lista é sempre o nó de DROP (output warehouse) dessa tarefa.
#   Waits ("W") e mensagens ("MSG_*") são expandidos pelo nó; um "W" no início da lista
#   faz esperar antes do primeiro movimento desse segmento. Parada usa /pi_pico_driver/wait_state;
#   o plan_handler pode enviar /target_id_send + /stop_waiting_send.
#
# Token syntax supported by the node:
#   - Integer node ids (e.g., 31, 16, 27)
#   - "1B", "2G", "1R", etc. (nth occurrence from left in /color_sequence)
#   - "1B_W", "2G_W", "1R_W" (same + wait marker at pick)
#   - "W" / "WAIT"
#   - "MSG_0", "MSG_1", "MSG_2", "MSG_ALL" (MSG_ALL -> 255)

###############################################################
#                                                             #
#                           2 ROBOTS                          #
#                                                             #
###############################################################
missions_2:
  manga_1:
    robot_spawns:
      robot_0: {x: -0.775, y: -0.305, theta: 1.5708}
