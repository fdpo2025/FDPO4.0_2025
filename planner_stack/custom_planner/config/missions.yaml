        - [13,12,"MSG_0",4,11,"1B",11,27,28,36]
        - ["MSG_0",28,30,15,14,"W",15,30,38]
       
  manga_3:
    robot_spawns:
      robot_0: {x: -0.775, y: -0.305, theta: 1.5708}
      robot_1: {x: -0.63, y: -0.405, theta: 1.5708}
