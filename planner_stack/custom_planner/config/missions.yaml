# custom_planner missions:
# - missions_2: run with 2 robots
# - missions_3: run with 3 robots
#
# Tarefas (targets):
#   Cada entrada "- [ ... ]" sob robot_N é UMA tarefa completa (estilo pick→drop).
#   O último inteiro da lista é sempre o nó de DROP (output warehouse) dessa tarefa.
#   Waits ("W") e mensagens ("MSG_*") são expandidos pelo nó; execução de parada
#   usa /pi_pico_driver/wait_state e o plan_handler envia /target_id_send + /stop_waiting_send.
#
# Token syntax supported by the node:
#   - Integer node ids (e.g., 31, 16, 27)
#   - "1B", "2G", "1R", etc. (nth occurrence from left in /color_sequence)
#   - "1B_W", "2G_W", "1R_W" (same + wait marker at pick)
#   - "W" / "WAIT"
#   - "MSG_0", "MSG_1", "MSG_2", "MSG_ALL" (MSG_ALL -> 255)

missions_2:
  manga_1:
    robot_spawns:
      robot_0: {x: -0.775, y: -0.305, theta: 1.5708}
      robot_1: {x: -0.63, y: -0.405, theta: 1.5708}
    robot_0:
      targets:
        - [31, 16, "MSG_1", "1B", 11, "MSG_1", 27, 28, 36]
        - ["W", 28, 27, 11, "2B", 11, "MSG_1", 12, 19, 20]
        - [20, 19, 26, 27, 30, 22, 21, 22, "MSG_1", 30, 29, 37]
    robot_1:
      targets:
        - ["W", 31, 16, "3B", "W", 11, 27, 35]
        - [35, 27, "MSG_0", 11, "4B", "W", 11, 12, 13]
        - [13, 12, 4, 7, 15, 14, "W", 15, 30, 38]

  manga_2:
    robot_spawns:
      robot_0: {x: -0.775, y: -0.305, theta: 1.5708}
      robot_1: {x: -0.63, y: -0.405, theta: 1.5708}
    robot_0:
