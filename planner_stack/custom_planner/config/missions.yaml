    #robot_0:
    #  targets:
    #    - [8, "MSG_1", "1B", 11, "MSG_1", 27, 30, 38]
    #    - [30,22,21,22,30,29,37]
    #robot_1:
    #  targets:
    #    - ["W", 8,"1R_W",8,16,17] 
    #    - [17,16,11,4,19,18,19,20] 
    #    - [20,19,4,11,"1G",11,12,13] 
    #    - [] 

    #2versao
    robot_0:
