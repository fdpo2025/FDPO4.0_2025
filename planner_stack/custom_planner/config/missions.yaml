        - [31, 16, "MSG_1", "1B", 11, "MSG_1", 27, 28, 36]
        - ["W", 28, 27, 11, "1G", 11, "MSG_1", 12, 19, 20]
        - [20, 19, 26, 27, 30, 22, 21, 22, "MSG_1", 30, 29, 37]
    robot_1:
      targets:
        - ["W", 31, 16, "2B", "W", 11, 27, 35]
        - [35, 27, "MSG_0", 11, "2G", "W", 11, 12, 13]
        - [13, 12, 4, 7, 15, 14, "W", 15, 30, 38]

  manga_3:
    robot_spawns:
      robot_0: {x: -0.695, y: -0.355, theta: 1.5708}
      robot_1: {x: -0.488, y: -0.355, theta: 0.0}
    robot_0:
      targets:
        - [31, 16, "MSG_1", "1R", 11, "MSG_1", 27, 28, 36]
        - ["W", 28, 27, 11, "1G", 11, "MSG_1", 12, 19, 20]
        - [20, 19, 26, 27, 30, 22, 21, 22, "MSG_1", 30, 29, 37]
    robot_1:
      targets:
        - ["W", 31, 16, "2G", "W", 11, 27, 35]
        - [35, 27, "MSG_0", 11, "1B", "W", 11, 12, 13]
        - [13, 12, 4, 7, 15, 14, "W", 15, 30, 38]

