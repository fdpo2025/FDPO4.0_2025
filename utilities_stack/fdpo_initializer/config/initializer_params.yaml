# Parâmetros do initializer_node (perfil real na Pi4).
#
# Carregado com <rosparam file="..."/> no namespace do nó (bootstrap.launch).
# Campos com $(env VAR) são expandidos em runtime pelo próprio initializer
# (não pelo roslaunch), de modo a ficar explícito no log qual o valor usado.

# Backend de leitura do switch.
#   gpiozero -> real (Raspberry Pi). Faz fallback automatico para 'sim' se
#               a lib nao estiver disponivel.
#   sim      -> le std_msgs/Bool do topico sim_topic (bancada/testes).
backend: "gpiozero"

# Pino GPIO (BCM). Ajustar ao hardware montado.
gpio_pin: 17
# True se o switch liga a GND quando premido (configuracao tipica com pull-up).
active_low: true

# Debounce por software aplicado no GpioButton (ms).
# Apos uma transicao aceite (press OU release), qualquer nova transicao
# que chegue antes deste intervalo e descartada (bounce mecanico do switch).
# Tambem e passado ao gpiozero como bounce_time, dando dupla protecao.
# Valores tipicos: 20-50 ms para um switch mecanico.
debounce_ms: 40

# Janela de inactividade apos o ultimo clique curto para confirmar o modo (ms).
inactivity_ms: 5000

# Tempo que o botao tem de estar premido para disparar "long press" (ms).
# Em S_RUNNING faz reset do stack; em outros estados cancela contagem.
long_press_ms: 5000

# Topico e status:
sim_topic: "/initializer/sim_button"
status_topic: "/initializer/status"

# Timeouts da escalada de sinais na paragem do stack filho.
sigint_timeout_s: 15.0
sigterm_timeout_s: 5.0

# Caminho para o devel/setup.bash a dar 'source' antes do roslaunch filho.
# Deixa string vazia se o ambiente ja esta configurado (tipicamente pelo
# systemd/launch pai).
source_setup: ""

# Mapeamento numero_de_cliques -> argumentos do roslaunch.
# IMPORTANTE: cada robo deve ter FDPO_ROBOT_ID definido como variavel de
# ambiente (0, 1, 2 ou 3). Essa variavel e injectada abaixo.
# As chaves sao strings de proposito: o rosparam do roslaunch trata as
# chaves de um dict como nomes de parametros ROS e nao aceita inteiros
# puros (faz name[0] internamente). O initializer_node converte-as para
# int em runtime.
click_to_mode:
  "1":
    launch_pkg: "conf"
    launch_file: "wake_up_fdpo.launch"
    args:
      planner_type: "chris"
      robot_id: "$(env FDPO_ROBOT_ID)"
      pico_robot_id: "$(env FDPO_ROBOT_ID)"

  "2":
    launch_pkg: "conf"
    launch_file: "wake_up_fdpo.launch"
    args:
      planner_type: "multi"
      robot_id: "$(env FDPO_ROBOT_ID)"
      pico_robot_id: "$(env FDPO_ROBOT_ID)"

  "3":
    launch_pkg: "conf"
    launch_file: "wake_up_fdpo_hardcoded.launch"
    args:
      pico_num_robots: "3"
      pico_robot_id: "$(env FDPO_ROBOT_ID)"

  "4":
    launch_pkg: "conf"
    launch_file: "wake_up_fdpo_hardcoded.launch"
    args:
      pico_num_robots: "4"
      pico_robot_id: "$(env FDPO_ROBOT_ID)"
